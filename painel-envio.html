<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de envio</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#14161b;--muted:#6b7080;--linha:#e3e5ea;--verde:#00a86b;--verde-suave:#e3f7ee;--wa:#25D366;--amarelo:#b7791f;--amarelo-suave:#fdf3e1;--vermelho:#d64545;--azul:#2d6a8f;--azul-suave:#e8f1f8;--r:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:5;background:#0a0b0e;color:#f4f5f7;padding:14px 20px}
  .topo{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;max-width:1400px;margin:0 auto}
  .topo h1{font-size:16px;font-weight:600;margin-right:auto}
  .topo h1 span{color:#00e58a}
  .kpi{display:flex;flex-direction:column}
  .kpi b{font-size:18px;font-variant-numeric:tabular-nums}
  .kpi small{color:#9aa0ad;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .barra{height:4px;background:#2a2d35;border-radius:2px;margin-top:4px;width:110px}
  .barra i{display:block;height:100%;background:#00e58a;border-radius:2px}
  main{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
  .controles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .abas{display:flex;flex-wrap:wrap;gap:6px;margin-right:auto}
  .aba{border:1px solid var(--linha);background:var(--card);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;color:var(--ink)}
  .aba.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .aba em{font-style:normal;opacity:.6;margin-left:4px}
  select,input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--card);color:var(--ink)}
  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);display:grid;grid-template-columns:110px 1fr;overflow:hidden}
  .card .thumb{background:#eceef2 center top/cover no-repeat;min-height:230px;display:block}
  .card .corpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .nome{font-weight:600;font-size:15px;line-height:1.25}
  .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .t-novo{background:#eef0f4;color:var(--muted)}.t-enviado{background:var(--amarelo-suave);color:var(--amarelo)}.t-respondeu{background:var(--azul-suave);color:var(--azul)}.t-fechou{background:var(--verde-suave);color:var(--verde)}.t-perdido{background:#fbeaea;color:var(--vermelho)}
  textarea{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--linha);border-radius:8px;padding:8px;resize:vertical;min-height:120px;color:var(--ink)}
  .acoes{display:flex;flex-wrap:wrap;gap:6px}
  .btn{border:1px solid var(--linha);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:#b9bdc7}
  .btn.wa{background:var(--wa);border-color:var(--wa);color:#063b1c;font-weight:600}
  .btn.prim{background:var(--ink);border-color:var(--ink);color:#fff}
  .aviso{font-size:12px;color:var(--amarelo)}
  .vazio{padding:60px 20px;text-align:center;color:var(--muted)}
  .rodape{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;color:var(--muted);font-size:12px;align-items:center}
  @media (max-width:520px){.lista{grid-template-columns:1fr}.card{grid-template-columns:90px 1fr}main,header{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header><div class="topo">
  <h1>Prévias de site · <span>Atlas Digital</span></h1>

  <div class="kpi"><b id="k-env">0</b><small>Contatados</small></div>
  <div class="kpi"><b id="k-resp">0</b><small>Responderam</small></div>
  <div class="kpi"><b id="k-fech">0/60</b><small>Sites fechados</small><div class="barra"><i id="b-fech"></i></div></div>
  <div class="kpi"><b id="k-rs">R$ 0</b><small>Vendido</small></div>
</div></header>

<main>
  <div class="controles">
    <div class="abas" id="abas"></div>
    <select id="f-cidade"><option value="">Todas as cidades</option></select>
    <select id="f-nicho"><option value="">Todos os nichos</option></select>
    <input type="search" id="f-busca" placeholder="Buscar nome">
  </div>
  <div class="lista" id="lista"></div>
  <div class="rodape">
    O status fica salvo neste navegador. Faça backup de vez em quando:
    <button class="btn" id="exportar">Baixar backup</button>
    <label class="btn">Restaurar backup<input type="file" id="importar" accept=".json" hidden></label>
    <button class="btn" id="csv">Exportar CSV</button>
  </div>
</main>

const META_DIA = 50, META_SITES = 60, PRECO = 1000, DIAS_FOLLOW = 2;
const CHAVE = 'painel-envio-atlas';
const NICHOS = { odonto: 'Odontologia', estetica: 'Estética', advocacia: 'Advocacia', nutricao: 'Nutrição', veterinaria: 'Veterinária', oficina: 'Oficina', contabilidade: 'Contabilidade', restaurante: 'Restaurante' };

let estado = {};
try { estado = JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { estado = {}; }
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} };
const st = slug => (estado[slug] ||= { status: 'novo' });
const hoje = () => new Date().toISOString().slice(0, 10);
const diasDesde = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : 0;
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const followUp = l => `Oi! Passando pra saber se conseguiu ver a prévia do site de vocês:\n${l.link}\n\nSe fizer sentido, me responde aqui que eu coloco no ar.`;
const precisaFollow = (l, s) => s.status === 'enviado' && !s.followEm && diasDesde(s.enviadoEm) >= DIAS_FOLLOW;

const ABAS = [
  ['enviar', 'A enviar', (l, s) => s.status === 'novo' && l.whatsapp],
  ['follow', 'Follow-up', precisaFollow],
  ['aguardando', 'Aguardando', (l, s) => s.status === 'enviado' && !precisaFollow(l, s)],
  ['conversa', 'Em conversa', (l, s) => s.status === 'respondeu'],
  ['fechou', 'Fechados', (l, s) => s.status === 'fechou'],
  ['fixo', 'Fixo / Instagram', (l, s) => s.status === 'novo' && !l.whatsapp],
  ['perdido', 'Perdidos', (l, s) => s.status === 'perdido'],
  ['todos', 'Todos', () => true],
];
let aba = 'enviar';

function filtrados() {
  const cid = document.getElementById('f-cidade').value, nic = document.getElementById('f-nicho').value;
  const busca = document.getElementById('f-busca').value.trim().toLowerCase();
  return LEADS.filter(l => (!cid || l.cidade === cid) && (!nic || l.nicho === nic) && (!busca || l.nome.toLowerCase().includes(busca)));
}

function card(l) {
  const s = st(l.slug);
  const msg = s.mensagem ?? l.mensagem;
  const local = l.print ? l.print.replace(/celular\.png$/, 'index.html') : '';
  const linhas = [];
  if (s.enviadoEm) linhas.push(`contatado há ${diasDesde(s.enviadoEm)} dia(s)`);
  if (s.followEm) linhas.push('follow-up feito');
  let acoes = '';
  if (s.status === 'novo' && l.whatsapp) acoes = `<button class="btn wa" data-a="enviar">Enviar no WhatsApp</button>`;
  else if (s.status === 'novo') acoes = `<a class="btn" href="tel:${l.telefone.replace(/\D/g, '')}">Ligar ${esc(l.telefone)}</a>${l.instagram ? `<a class="btn" href="${esc(l.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ''}<button class="btn" data-a="copiar">Copiar mensagem</button><button class="btn prim" data-a="contatado">Marcar contatado</button>`;
  else if (precisaFollow(l, s) && l.whatsapp) acoes = `<button class="btn wa" data-a="follow">Mandar follow-up</button>`;
  if (s.status === 'enviado') acoes += `<button class="btn" data-a="respondeu">Respondeu</button>`;
  if (s.status === 'enviado' || s.status === 'respondeu') acoes += `<button class="btn prim" data-a="fechou">Fechou</button><button class="btn" data-a="perdido">Perdido</button>`;
  if (s.status !== 'novo') acoes += `<button class="btn" data-a="desfazer">Voltar pra novo</button>`;
  if (l.whatsapp && s.status !== 'novo') acoes += `<a class="btn" href="${esc(l.whatsapp)}" target="_blank" rel="noopener">Abrir conversa</a>`;
  return `<article class="card" data-slug="${esc(l.slug)}">
    <a class="thumb" href="${esc(local || l.link)}" target="_blank" rel="noopener" title="Abrir prévia" style="background-image:url('${esc(l.print)}')"></a>
    <div class="corpo">
      <div><span class="tag t-${s.status}">${s.status}</span></div>
      <div class="nome">${esc(l.nome)}</div>
      <div class="meta"><span>${esc(l.cidade)}</span><span>${esc(NICHOS[l.nicho] || l.nicho)}</span>${l.avaliacoes ? `<span>${esc(l.nota)} ★ · ${l.avaliacoes}</span>` : ''}<span>${l.whatsapp ? 'celular' : 'fixo'}</span><a href="${esc(l.link_maps)}" target="_blank" rel="noopener">Maps</a></div>
      ${linhas.length ? `<div class="meta">${linhas.join(' · ')}</div>` : ''}
      ${s.status === 'novo' ? `<textarea data-a="editar">${esc(msg)}</textarea>` : ''}
      ${!l.print ? '<div class="aviso">Sem print. Confira a prévia antes de enviar.</div>' : ''}
      <div class="acoes">${acoes}</div>
    </div>
  </article>`;
}

function render() {
  const base = filtrados();
  document.getElementById('abas').innerHTML = ABAS.map(([id, rot, f]) => `<button class="aba ${id === aba ? 'on' : ''}" data-aba="${id}">${rot}<em>${base.filter(l => f(l, st(l.slug))).length}</em></button>`).join('');
  const f = ABAS.find(a => a[0] === aba)[2];
  const lista = base.filter(l => f(l, st(l.slug))).sort((a, b) => b.avaliacoes - a.avaliacoes);
  document.getElementById('lista').innerHTML = lista.length ? lista.map(card).join('') : '<div class="vazio">Nada aqui.</div>';

  const todos = LEADS.map(l => st(l.slug));
  const envHoje = todos.filter(s => s.enviadoEm?.startsWith(hoje())).length;
  const contatados = todos.filter(s => s.status !== 'novo').length;
  const resp = todos.filter(s => s.status === 'respondeu' || s.status === 'fechou').length;
  const fech = todos.filter(s => s.status === 'fechou').length;
  document.getElementById('k-hoje').textContent = `${envHoje}/${META_DIA}`;
  document.getElementById('b-hoje').style.width = Math.min(100, envHoje / META_DIA * 100) + '%';
  document.getElementById('k-env').textContent = contatados;
  document.getElementById('k-resp').textContent = contatados ? `${resp} (${Math.round(resp / contatados * 100)}%)` : '0';
  document.getElementById('k-fech').textContent = `${fech}/${META_SITES}`;
  document.getElementById('b-fech').style.width = Math.min(100, fech / META_SITES * 100) + '%';
  document.getElementById('k-rs').textContent = 'R$ ' + (fech * PRECO).toLocaleString('pt-BR');
}

function abrirWa(l, texto) { window.open(`${l.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener'); }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.aba) { aba = t.dataset.aba; return render(); }
  const a = t.dataset.a; if (!a || a === 'editar') return;
  const slug = t.closest('.card').dataset.slug, l = LEADS.find(x => x.slug === slug), s = st(slug);
  const agora = new Date().toISOString();
  if (a === 'enviar') { abrirWa(l, s.mensagem ?? l.mensagem); Object.assign(s, { status: 'enviado', enviadoEm: agora }); }
  if (a === 'follow') { abrirWa(l, followUp(l)); s.followEm = agora; }
  if (a === 'copiar') { navigator.clipboard?.writeText(s.mensagem ?? l.mensagem); t.textContent = 'Copiada'; return; }
  if (a === 'contatado') Object.assign(s, { status: 'enviado', enviadoEm: agora });
  if (a === 'respondeu') Object.assign(s, { status: 'respondeu', respondeuEm: agora });
  if (a === 'fechou') Object.assign(s, { status: 'fechou', fechouEm: agora });
  if (a === 'perdido') Object.assign(s, { status: 'perdido', perdidoEm: agora });
  if (a === 'desfazer') estado[slug] = { status: 'novo', mensagem: s.mensagem };
  salvar(); render();
});
document.addEventListener('input', e => {
  if (e.target.dataset.a !== 'editar') return;
  st(e.target.closest('.card').dataset.slug).mensagem = e.target.value; salvar();
});
['f-cidade', 'f-nicho', 'f-busca'].forEach(id => document.getElementById(id).addEventListener('input', render));

function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome; a.click();
}
document.getElementById('exportar').onclick = () => baixar(`painel-envio-backup-${hoje()}.json`, JSON.stringify(estado, null, 2), 'application/json');
document.getElementById('importar').onchange = async e => {
  try { estado = JSON.parse(await e.target.files[0].text()); salvar(); render(); } catch (err) { alert('Arquivo de backup inválido.'); }
};
document.getElementById('csv').onclick = () => {
  const cols = ['nome', 'cidade', 'nicho', 'telefone', 'status', 'enviadoEm', 'followEm', 'respondeuEm', 'fechouEm', 'link'];
  const linhas = LEADS.map(l => { const s = st(l.slug); return cols.map(c => `"${String(l[c] ?? s[c] ?? '').replace(/"/g, '""')}"`).join(';'); });
  baixar(`painel-envio-${hoje()}.csv`, '\uFEFF' + [cols.join(';'), ...linhas].join('\n'), 'text/csv');
};

for (const [id, valores] of [['f-cidade', [...new Set(LEADS.map(l => l.cidade))].sort()], ['f-nicho', [...new Set(LEADS.map(l => l.nicho))].sort()]])
  document.getElementById(id).insertAdjacentHTML('beforeend', valores.map(v => `<option value="${esc(v)}">${esc(NICHOS[v] || v)}</option>`).join(''));
render();
</script>
</body>
</html>
